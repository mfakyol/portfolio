# Security headers shared by every *.fatihakyol.com site (include in each HTTPS server block).
# "always" also sends them on error responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SAMEORIGIN, not DENY: code-editor shows its own preview in a same-origin iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
